version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      ionic:
        patterns: ['@ionic/*', 'ionicons']
      testing:
        patterns: ['karma*', 'jasmine*', '@types/jasmine', '@playwright/test']
      lint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
